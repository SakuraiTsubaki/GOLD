name: GOLD Gen10 Capacity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gen10-capacity.yml"
      - "patches/pokeemerald-expansion/**"
      - "scripts/**"
      - "tools/check_pokeemerald_capacity.py"
      - "config/engine_capacity.json"
      - "engine/include/gold_capacity.h"
      - "docs/GBA_GEN10_CAPACITY.md"
  pull_request:
    paths:
      - ".github/workflows/gen10-capacity.yml"
      - "patches/pokeemerald-expansion/**"
      - "scripts/**"
      - "tools/check_pokeemerald_capacity.py"
      - "config/engine_capacity.json"
      - "engine/include/gold_capacity.h"
      - "docs/GBA_GEN10_CAPACITY.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GOLD
        uses: actions/checkout@v4

      - name: Install GBA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Prepare pinned runtime and apply GOLD patches
        run: bash scripts/prepare_runtime.sh

      - name: Build patched runtime
        run: JOBS=2 bash scripts/build_runtime.sh
